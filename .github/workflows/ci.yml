# Builds the app and runs the tests on every pull request and on main
# (AGENTS.md: ctest must pass and the build must have no warnings).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Build and test (Linux, Qt 6.8.3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # docs/07-development-setup.md, step 1.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl-dev libegl-dev libopengl-dev libxkbcommon-dev libvulkan-dev libxcb-cursor0

      # Qt 6.8.3 via aqtinstall, as on the development machines (D-013);
      # never the distribution's Qt 6.4.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: qtimageformats
          cache: true

      # Warnings fail the build, like the rule for commits.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra"
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      # No display on the runner: Qt draws offscreen.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  # No capture backend on Windows yet; this checks that the editor builds
  # and its tests pass with MSVC on both Windows architectures.
  windows:
    name: Build and test (Windows ${{ matrix.arch }}, Qt 6.8.3)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            aqt-host: windows
            aqt-arch: win64_msvc2022_64
            qt-dir: msvc2022_64
          - arch: arm64
            runner: windows-11-arm
            aqt-host: windows_arm64
            aqt-arch: win64_msvc2022_arm64
            qt-dir: msvc2022_arm64
    env:
      QT_DIR: C:\Qt\6.8.3\${{ matrix.qt-dir }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt from aqtinstall, as on the development machines
      # (docs/07-development-setup.md); cached per architecture.
      - name: Cache Qt
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: C:\Qt\6.8.3\${{ matrix.qt-dir }}
          key: qt-6.8.3-${{ matrix.aqt-arch }}-v1

      - name: Install Qt
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt ${{ matrix.aqt-host }} desktop 6.8.3 ${{ matrix.aqt-arch }} -m qtimageformats -O C:\Qt

      # The MSVC compiler for the runner's own architecture.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # MSVC's default warning level; warnings fail the build.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      # The test programs need the Qt DLLs; no display: Qt draws offscreen.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "$env:QT_DIR\bin;$env:PATH"
          ctest --test-dir build --output-on-failure

      # When a test program fails without output, run each one directly:
      # its exit code, the Qt Test log written to a file, and Qt messages
      # on stderr (on Windows they may otherwise go to the debugger only).
      - name: Diagnose failed tests
        if: failure()
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: |
          $env:PATH = "$env:QT_DIR\bin;$env:PATH"
          foreach ($test in Get-ChildItem build\tests\tst_*.exe) {
            $log = "$env:RUNNER_TEMP\$($test.BaseName).txt"
            & $test.FullName -o "$log,txt" -o "-,txt" 2>&1 | Out-Host
            Write-Host ("{0}: exit code {1} (0x{1:X8})" -f $test.BaseName, $LASTEXITCODE)
            if (Test-Path $log) { Get-Content $log | Select-Object -Last 40 | Out-Host }
          }

  extension:
    name: Check GNOME extension and tools
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The extension is ES modules (GNOME 45+); node only parses them as
      # modules with the .mjs extension (AGENTS.md).
      - name: Syntax check of the extension
        run: |
          mkdir -p "$RUNNER_TEMP/ext"
          for file in gnome-extension/*/*.js; do
            copy="$RUNNER_TEMP/ext/$(basename "$file" .js).mjs"
            cp "$file" "$copy"
            node --check "$copy"
            echo "ok: $file"
          done

      - name: Syntax check of the PoC client and scripts
        run: |
          python3 -m py_compile tools/nsl-snap-pick
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "ok: $script"
          done
